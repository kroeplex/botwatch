name: Initialize workarea
description: Set up Python and Poetry and install dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version

    - name: Install Poetry
      shell: bash
      run: pip install 'poetry>=2.0'

    - name: Install dependencies
      shell: bash
      run: poetry install
