[project]
name = 'botwatch'
version = '0.2.0'
description = 'A one-shot select over many event sources, for agents.'
readme = 'README.md'
license = 'Apache-2.0'
license-files = ['LICENSE']
requires-python = '>=3.14,<4'
dependencies = [
    'httpx (>=0.28,<1)',
    'pydantic (>=2,<3)',
    'pydantic-settings (>=2,<3)',
    'pyyaml (>=6,<7)',
    'turbopipes @ git+https://github.com/kkroening/turbopipes.git@0.4.0',
]

[project.scripts]
botwatch = 'botwatch._cli:main'

[tool.poetry.group.dev.dependencies]
black = '*'
isort = { extras = ['colors'], version = '*' }
mypy = '*'
pylint = '*'
pytest = '*'
pytest-asyncio = '*'
pytest-mock = '*'
pytest-randomly = '*'
pytest-timeout = '*'
types-pyyaml = '*'

[build-system]
requires = ['poetry-core>=2']
build-backend = 'poetry.core.masonry.api'

[tool.black]
include = '^/(botwatch|tests)/.*\.pyi?$'
skip-string-normalization = true
target_version = ['py314']

[tool.isort]
ensure_newline_before_comments = true
force_grid_wrap = 0
force_single_line = true
ignore_whitespace = true
include_trailing_comma = true
line_length = 88
multi_line_output = 3
no_sections = true
use_parentheses = true

[tool.mypy]
strict = true
files = ['botwatch', 'tests']
pretty = true

[tool.pytest.ini_options]
# The channel drivers are async generators, so effectively every test that
# touches one is a coroutine; `asyncio_mode = 'auto'` saves marking each.
asyncio_default_fixture_loop_scope = 'function'
asyncio_mode = 'auto'
# A driver that never wakes is this project's signature failure, and without a
# per-test ceiling it presents as a CI job that hangs rather than a red test.
timeout = 5
filterwarnings = [
    'error::pytest.PytestUnraisableExceptionWarning',
    'error::RuntimeWarning',
]
testpaths = ['tests']
